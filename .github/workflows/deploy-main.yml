name: Deploy main

# 合并即部署：CI 在 main 上通过后，把该提交部署到服务器（同一台 Lighthouse，
# 但只覆盖当前容器；失败自动回滚，见 deploy/deploy.sh）。
#
# 为什么默认关闭
# ────────────────────────────────────────────────────────────────
# 生产环境「每次合并都上线」需要主人明确点头。开关是仓库变量，而不是往
# workflow 里写死一个 if：
#   Settings → Secrets and variables → Actions → Variables
#     SM_AUTO_DEPLOY_MAIN = true     # 打开合并自动部署
# 未设置时本 workflow 直接跳过（日志里给出提示），不会误上线。
#
# 触发链路：workflow_run（CI 完成）→ 校验结论为 success 且分支是 main
#          → TAT 下发 git fetch/checkout → deploy.sh（构建 → 重建 → 健康探测 → 回滚）
#
# 需要的 Secrets 与 deploy-tencent.yml 相同：
#   TENCENTCLOUD_SECRET_ID / TENCENTCLOUD_SECRET_KEY / SM_INSTANCE_ID / SM_REGION
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "要部署的提交（默认 main 最新）"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

# 部署不能并发：镜像 tag 与容器会被互相覆盖，排队执行。
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main via TAT
    # 只在 CI 成功、或手动触发时执行；变量未开启则跳过。
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && vars.SM_AUTO_DEPLOY_MAIN == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          # 部署 CI 实际验证过的那个提交，而不是此刻的 main（可能已被新提交推进）
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || 'main' }}

      - name: 检查配置
        id: guard
        env:
          INSTANCE: ${{ secrets.SM_INSTANCE_ID }}
          REGION: ${{ secrets.SM_REGION }}
        run: |
          if [ -z "${INSTANCE}" ] || [ -z "${REGION}" ]; then
            echo "::warning::缺少 SM_INSTANCE_ID / SM_REGION，跳过合并自动部署。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version
        if: steps.guard.outputs.enabled == 'true'
        id: meta
        run: |
          SHA="$(git rev-parse --short=7 HEAD)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "部署提交: ${SHA}（$(git log -1 --pretty=%s)）"

      - name: Build deploy command
        if: steps.guard.outputs.enabled == 'true'
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          cat > /tmp/sm-deploy-main.sh <<'CMD'
          set -euo pipefail
          cd /opt/stockmaster
          echo "=== 部署前状态 ==="
          docker ps --format '{{.Names}} {{.Image}} {{.Status}}' | grep stockmaster || true
          echo "=== 拉取代码 ==="
          git fetch origin main --prune --force
          CMD
          echo "git checkout -f ${SHA}" >> /tmp/sm-deploy-main.sh
          cat >> /tmp/sm-deploy-main.sh <<'CMD'
          echo "=== 当前提交 ==="
          git log -1 --oneline
          echo "=== 开始部署 ==="
          ./deploy/deploy.sh "main-$(git rev-parse --short=7 HEAD)"
          echo "=== 部署后状态 ==="
          docker ps --format '{{.Names}} {{.Image}} {{.Status}}' | grep stockmaster
          curl -fsS -m 5 http://127.0.0.1:8770/api/v1/health
          CMD
          cat /tmp/sm-deploy-main.sh

      - name: Deploy via TAT
        if: steps.guard.outputs.enabled == 'true'
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          python3 scripts/deploy_via_tat.py \
            --region "${{ secrets.SM_REGION }}" \
            --instance-id "${{ secrets.SM_INSTANCE_ID }}" \
            --command-file /tmp/sm-deploy-main.sh \
            --timeout 3600 \
            --max-wait 3300 \
            --poll-interval 15 \
            --working-directory /opt/stockmaster

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::main 部署失败。deploy.sh 会自动回滚，线上仍运行上一版本。"
          echo "::error::若卡在 docker build，多为基础镜像/PyPI 拉取超时，重跑通常恢复。"
