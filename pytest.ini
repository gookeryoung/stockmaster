# pytest 配置单一来源（与 cndb 一致：配置放在 pytest.ini 而非 pyproject.toml）。
# 注意：pytest 对 pytest.ini 的优先级高于 pyproject.toml，二者并存时后者会被静默忽略。

[pytest]
testpaths = tests
pythonpath = src
# --dist worksteal 仅在调用方传入 -n/--numprocesses 时生效：Makefile `test`/`cov`
# 传 PYTEST_JOBS；单独执行 `pytest`（无 -n）时该选项被 xdist 忽略，串行运行。
addopts = -q --strict-markers --dist worksteal --durations=20

markers =
    contract: provider contract tests (offline, fixture-driven)
    network: requires live network access to a data provider (run with -m network)
    integration: full-chain integration test
    # 慢测试：真实子进程/服务器或全链路 e2e，单条 >1s 且与并行不友好。
    # 默认 `make test`/`make cov` 与 CI 以 `-m "not slow"` 排除，快速反馈；
    # 需要覆盖慢集时用 `make test-slow`（或 `make test-all`）本地显式运行。
    slow: heavy tests (real subprocess/server or full-chain e2e); run with -m slow

# 单测超时保护：数据源偶发挂起，避免 CI 被卡死。
# 300s 是刻意留出的余量：全市场训练类测试在单 worker 上可达 ~100s，
# 而挂起的 provider 调用会一直阻塞，所以仍能在几分钟内失败而不是无限等待。
timeout = 300
# 包含 fixture 与 teardown 的墙钟时间：挂起发生在取数阶段时才能真正中断。
timeout_func_only = false

filterwarnings =
    ignore::DeprecationWarning
    ignore::sqlalchemy.exc.LegacyAPIWarning
    # starlette TestClient 的 httpx 弃用提示（上游问题）；该类不继承 DeprecationWarning，
    # 必须按类别单独忽略，否则会出现在测试 warnings 汇总里
    ignore::starlette.exceptions.StarletteDeprecationWarning
