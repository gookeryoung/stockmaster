# ═══════════════════════════════════════════════════════════════════
# StockMaster —— 独立子域 HTTPS 反代（由同机 cndb 的 nginx 承载）
#
# 为什么放在 cndb 的目录里：本机 80/443 只有 cndb 的 nginx 容器在监听，
# 起不了第二个 TLS 前端，所以 StockMaster 的 HTTPS 借道 cndb 的 nginx。
#
# 安装位置：/opt/cndb/deploy/nginx/extra/stockmaster.conf
#   （由 cndb 模板末尾的 `include /etc/nginx/extra/*.conf;` 加载）
# 本文件**只新增 server 块**，不改动 cndb 自己的任何 server：
# nginx 按 server_name 精确匹配，二者互不干扰。删掉本文件 + reload 即可完全撤销。
#
# 证书：由 deploy/setup-tls.sh 用 certbot(HTTP-01) 签发，
#      落到 /opt/cndb/certs/stock-{fullchain,privkey}.pem
#
# 上游：StockMaster 容器与 cndb-nginx 共用 cndb_default 网络，这里直接用容器名
#       回源（docker 内置 DNS 解析），**不要**写 172.18.0.x 网关或固定容器 IP：
#         - 网关回连依赖宿主端口发布，而 compose 默认只绑 127.0.0.1:8770，
#           从容器回连宿主网关会直接 502（曾因此整站不可访问）
#         - 固定 IP 在容器重建后会变，nginx 只在启动时解析一次，同样 502
#       `resolve` + docker DNS（127.0.0.11）让 nginx 每 10s 重新解析容器名，
#       容器重建/换 IP 后无需 reload 即可自愈。需 nginx ≥ 1.27.3。
#
# 自检：docker exec cndb-nginx nginx -t && docker exec cndb-nginx nginx -s reload
# ═══════════════════════════════════════════════════════════════════

upstream stockmaster_app {
    # resolve 必须配合 zone 才能在 open source 版生效
    zone stockmaster_app 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server stockmaster:8770 resolve;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name stock.gookeryoung.cn;

    # ACME HTTP-01 校验路径必须留在 80 端口（否则续期会失败），
    # root 与 cndb 共用同一个 webroot。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stock.gookeryoung.cn;

    ssl_certificate     /etc/nginx/certs/stock-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/stock-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 故意不加 HSTS：本块是借道配置，出问题时保留浏览器回退 http 的余地
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 64m;

    location / {
        proxy_pass http://stockmaster_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 清空 Connection 才能复用 upstream keepalive
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
