# ═══════════════════════════════════════════════════════════════════
# StockMaster —— 独立子域 HTTPS 反代（由同机 cndb 的 nginx 承载）
#
# 为什么放在 cndb 的目录里：本机 80/443 只有 cndb 的 nginx 容器在监听，
# 起不了第二个 TLS 前端，所以 StockMaster 的 HTTPS 借道 cndb 的 nginx。
#
# 安装位置：/opt/cndb/deploy/nginx/extra/stockmaster.conf
#   （由 cndb 模板末尾的 `include /etc/nginx/extra/*.conf;` 加载）
# 本文件**只新增 server 块**，不改动 cndb 自己的任何 server：
# nginx 按 server_name 精确匹配，二者互不干扰。删掉本文件 + reload 即可完全撤销。
#
# 证书：由 deploy/setup-tls.sh 用 certbot(HTTP-01) 签发，
#      落到 /opt/cndb/certs/stock-{fullchain,privkey}.pem
#
# 上游：StockMaster 把 8770 发布在宿主 0.0.0.0:8770，故从 cndb_default 网络
#      经其网关回连宿主。cndb 的 compose 项目若被整体重建可能换网段，用：
#        docker inspect cndb-nginx --format '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}'
#      取新网关后改下面的 server 行。
# ═══════════════════════════════════════════════════════════════════

upstream stockmaster_app {
    server 172.18.0.1:8770;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name stock.gookeryoung.cn;

    # ACME HTTP-01 校验路径必须留在 80 端口（否则续期会失败），
    # root 与 cndb 共用同一个 webroot。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stock.gookeryoung.cn;

    ssl_certificate     /etc/nginx/certs/stock-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/stock-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 故意不加 HSTS：本块是借道配置，出问题时保留浏览器回退 http 的余地
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 64m;

    location / {
        proxy_pass http://stockmaster_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 清空 Connection 才能复用 upstream keepalive
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
