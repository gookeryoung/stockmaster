[project]
name = "stockmaster"
version = "0.1.0"
description = "A-share daily-bar quantitative analysis workbench: data, analysis, prediction, alerts"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pandas>=2.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "baostock>=0.9.4",
    "akshare>=1.19",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
]

[project.scripts]
stockmaster = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
markers = [
    "contract: provider contract tests (offline, fixture-driven)",
    "network: requires live network access to a data provider",
    "integration: full-chain integration test",
]
filterwarnings = ["ignore::DeprecationWarning"]
