[project]
name = "stockmaster"
version = "0.2.0"
description = "A-share daily-bar quantitative analysis workbench: data, analysis, prediction, alerts"
readme = "README.md"
license = "MIT"
keywords = ["quantitative-finance", "a-share", "stock-analysis", "machine-learning", "backtest", "fastapi", "react"]
requires-python = ">=3.13"
authors = [{ name = "StockMaster" }]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pandas>=2.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "httpx>=0.27",
    "apscheduler>=3.10",
    # 主数据源：源端直接给出前/后/不复权价格与 preclose/isST/turn
    "baostock>=0.9.4",
    # 备源封装（腾讯/新浪）。注意：本机 Python 侧无法访问东方财富，
    # 故 akshare 的 *_em 接口不可用，仅使用其 tx/sina 后端。
    "akshare>=1.19",
    "python-dateutil>=2.9",
]

[project.urls]
Homepage = "https://github.com/gookeryoung/stockmaster"
Repository = "https://github.com/gookeryoung/stockmaster"
Issues = "https://github.com/gookeryoung/stockmaster/issues"

[project.optional-dependencies]
dev = ["stockmaster[lint,test]"]
# Sphinx 文档站依赖：仅 ReadTheDocs 与 `uv sync --extra docs` 使用，
# 刻意不并入 dev，避免日常开发环境被文档工具链拖慢。
docs = [
    "sphinx>=8.1",
    "sphinx-rtd-theme>=3.0",
    "myst-parser>=4.0",
]
# ruff 固定精确版本：本地 `uv run ruff` 必须与 .pre-commit-config.yaml 的 rev 一致，
# 否则同一提交在本地 hook 与 CI 会得到不同的 lint 结果。
lint = ["ruff==0.16.8"]
test = [
    "pytest>=8.3",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0,<2.5",
    "pytest-xdist>=3.6.1",
    # starlette TestClient 运行所需
    "httpx>=0.27",
    "anyio>=4.6",
]

[project.scripts]
stockmaster = "stockmaster.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockmaster"]

[tool.hatch.build.targets.sdist]
exclude = [
    "frontend/node_modules/**",
    "frontend/dist/**",
    "data/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    "htmlcov/**",
    "dist/**",
    "build/**",
    "*.egg-info/**",
]

[tool.bumpversion]
current_version = "0.2.0"
commit = true
# ASCII-only message: bump-my-version mangles non-ASCII templates under a GBK
# locale (observed as mojibake in the generated commit message).
message = "chore(release): bump version {current_version} -> {new_version}"
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(version\s+=\s+)"{current_version}"'
replace = '\1"{new_version}"'

[[tool.bumpversion.files]]
filename = "src/stockmaster/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

# 测试配置统一放在 pytest.ini（pytest 对 pytest.ini 的优先级高于 pyproject.toml，
# 二者并存会导致此处被静默忽略），此处不再重复声明。

[tool.coverage.run]
branch = true
source = ["stockmaster"]
omit = [
    "src/stockmaster/cli.py",
    "src/stockmaster/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
