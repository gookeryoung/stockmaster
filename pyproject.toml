[project]
name = "stockmaster"
version = "0.1.1"
description = "A-share daily-bar quantitative analysis workbench: data, analysis, prediction, alerts"
readme = "README.md"
license = "MIT"
keywords = ["quantitative-finance", "a-share", "stock-analysis", "machine-learning", "backtest", "fastapi", "react"]
requires-python = ">=3.13"
authors = [{ name = "StockMaster" }]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pandas>=2.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "httpx>=0.27",
    "apscheduler>=3.10",
    # 主数据源：源端直接给出前/后/不复权价格与 preclose/isST/turn
    "baostock>=0.9.4",
    # 备源封装（腾讯/新浪）。注意：本机 Python 侧无法访问东方财富，
    # 故 akshare 的 *_em 接口不可用，仅使用其 tx/sina 后端。
    "akshare>=1.19",
    "python-dateutil>=2.9",
]

[project.urls]
Homepage = "https://github.com/gookeryoung/stockmaster"
Repository = "https://github.com/gookeryoung/stockmaster"
Issues = "https://github.com/gookeryoung/stockmaster/issues"

[project.optional-dependencies]
dev = ["stockmaster[lint,test]"]
# ruff 固定精确版本：本地 `uv run ruff` 必须与 .pre-commit-config.yaml 的 rev 一致，
# 否则同一提交在本地 hook 与 CI 会得到不同的 lint 结果。
lint = ["ruff==0.16.8"]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0,<2.5",
    "pytest-xdist>=3.6.1",
    # starlette TestClient 运行所需
    "httpx>=0.27",
    "anyio>=4.6",
]

[project.scripts]
stockmaster = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.hatch.build.targets.sdist]
exclude = [
    "frontend/node_modules/**",
    "frontend/dist/**",
    "data/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    "htmlcov/**",
    "dist/**",
    "build/**",
    "*.egg-info/**",
]

[tool.bumpversion]
current_version = "0.1.1"
commit = true
# ASCII-only message: bump-my-version mangles non-ASCII templates under a GBK
# locale (observed as mojibake in the generated commit message).
message = "chore(release): bump version {current_version} -> {new_version}"
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(version\s+=\s+)"{current_version}"'
replace = '\1"{new_version}"'

[[tool.bumpversion.files]]
filename = "backend/app/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
# --dist worksteal 仅在调用方传入 -n/--numprocesses 时生效：Makefile `test`/`cov`
# 传 PYTEST_JOBS；单独执行 `pytest`（无 -n）时该选项被 xdist 忽略，串行运行。
addopts = "-q --strict-markers --dist worksteal --durations=20"
markers = [
    "contract: provider contract tests (offline, fixture-driven)",
    "network: requires live network access to a data provider (run with -m network)",
    "integration: full-chain integration test",
]
# 单测超时保护：数据源偶发挂起，避免 CI 被卡死。
# 300s 是刻意留出的余量：全市场训练类测试在单 worker 上可达 ~100s，
# 而挂起的 provider 调用会一直阻塞，所以仍能在几分钟内失败而不是无限等待。
timeout = 300
# 包含 fixture 与 teardown 的墙钟时间：挂起发生在取数阶段时才能真正中断。
timeout_func_only = false
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::sqlalchemy.exc.LegacyAPIWarning",
    # starlette TestClient 的 httpx 弃用提示（上游问题）
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "backend/app/cli.py",
    "backend/app/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
