# ═══════════════════════════════════════════════════════════════════
# StockMaster 生产编排 — 腾讯云轻量应用服务器（单机单容器形态）
#
# 与同机的 cndb 并存：cndb 的 nginx 容器独占 80/443，本服务因此
# 对外使用独立端口 8770（http://<域名>:8770），互不影响。
# 需要 HTTPS 时跑 deploy/setup-tls.sh：借道 cndb 的 nginx 加一个
# server_name=stock.gookeryoung.cn 的 server 块反代到本容器（443 无法再绑）。
#
# 设计要点：
#   - 镜像由 deploy/deploy.sh 在服务器本地构建，本文件只引用 .env 里的镜像地址
#   - 唯一数据卷 stockmaster-data 挂 /data（SQLite 库 + 训练模型），换版本不动它
#   - restart: unless-stopped 保证开机自启 + 崩溃拉起
#
# 首次上线：
#   cp deploy/.env.prod.example .env && vim .env
#   ./deploy/deploy.sh            # 服务器本地构建 → 备份 → 重建 → 健康探测
#
# 常用运维命令：
#   docker compose --env-file .env -f docker-compose.prod.yml logs -f app
#   docker compose --env-file .env -f docker-compose.prod.yml exec app python -m stockmaster.cli stats
#   docker compose --env-file .env -f docker-compose.prod.yml exec app python -m stockmaster.cli doctor
# ═══════════════════════════════════════════════════════════════════

services:
  app:
    # 完整地址由 deploy.sh 写入 .env（形如 stockmaster:v0.1.4）
    image: ${SM_IMAGE:?SM_IMAGE 未设置，请在 .env 中配置镜像地址}
    container_name: stockmaster
    restart: unless-stopped

    volumes:
      - stockmaster-data:/data

    environment:
      # 容器内必须绑 0.0.0.0：默认的 127.0.0.1 只能在容器内部可达，宿主映射进不来
      - SM_HOST=0.0.0.0
      - SM_PORT=8770
      # 数据根目录整体覆盖：库、模型产物、日志都落在这个卷里
      - SM_DATA_DIR=/data
      - SM_LOG_LEVEL=${SM_LOG_LEVEL:-INFO}
      - SM_TIMEZONE=Asia/Shanghai
      # 内置 APScheduler（收盘后自动同步/预警巡检）。多副本时只能开一个实例。
      - SM_SCHEDULER_ENABLED=${SM_SCHEDULER_ENABLED:-true}
      # 数据源优先级：主源失败自动降级到备源
      - SM_PROVIDER_ORDER=${SM_PROVIDER_ORDER:-baostock,tencent,sina}
      # baostock 对并发敏感，不要调高
      - SM_SYNC_WORKERS=${SM_SYNC_WORKERS:-4}
      # 留空即关闭外发 webhook 通知
      - SM_ALERT_WEBHOOK_URL=${SM_ALERT_WEBHOOK_URL:-}
      # 隔离开启时，没有配置通道的工作区是否回落到上面的全站 webhook（默认严格隔离）
      - SM_ALERT_GLOBAL_FALLBACK=${SM_ALERT_GLOBAL_FALLBACK:-false}
      # ── 邮件通知（工作区通道 kind=email；SMTP 是部署级凭据）──────────
      - SM_SMTP_HOST=${SM_SMTP_HOST:-}
      - SM_SMTP_PORT=${SM_SMTP_PORT:-587}
      - SM_SMTP_USERNAME=${SM_SMTP_USERNAME:-}
      - SM_SMTP_PASSWORD=${SM_SMTP_PASSWORD:-}
      - SM_SMTP_FROM=${SM_SMTP_FROM:-}
      - SM_SMTP_TLS=${SM_SMTP_TLS:-true}
      - SM_SMTP_TIMEOUT=${SM_SMTP_TIMEOUT:-10}
      # 容器内固定 UTF-8，避免中文日志乱码/报错
      - SM_CONSOLE_ENCODING=utf-8
      # ── 账号与登录 ────────────────────────────────────────────
      # 关闭时接口开放（单机直连），账号页仍可用；改为 true 即强制登录。
      - SM_AUTH_ENABLED=${SM_AUTH_ENABLED:-false}
      # 留空则自动生成并持久化到 /data/.auth_secret（多实例部署必须显式同值）
      - SM_AUTH_SECRET_KEY=${SM_AUTH_SECRET_KEY:-}
      - SM_AUTH_ALLOW_REGISTER=${SM_AUTH_ALLOW_REGISTER:-true}
      # 启动时创建/修复的管理员（密码只在账号不存在时生效）
      - SM_ADMIN_USERNAME=${SM_ADMIN_USERNAME:-}
      - SM_ADMIN_PASSWORD=${SM_ADMIN_PASSWORD:-}
      # 微信登录：open=网站应用扫码 mp=公众号 mock=本地模拟 off=关闭
      - SM_WECHAT_LOGIN_MODE=${SM_WECHAT_LOGIN_MODE:-open}
      - SM_WECHAT_APP_ID=${SM_WECHAT_APP_ID:-}
      - SM_WECHAT_APP_SECRET=${SM_WECHAT_APP_SECRET:-}
      # 必须与微信平台登记的授权回调域名完全一致；留空则由请求 Host 推导
      - SM_WECHAT_REDIRECT_URI=${SM_WECHAT_REDIRECT_URI:-}
      # SPA 对外地址（扫码回调后跳回），留空=同源自动推导
      - SM_AUTH_FRONTEND_BASE=${SM_AUTH_FRONTEND_BASE:-}
      # 工作区隔离（owner/editor/viewer，见 docs/WORKSPACE.md）；false = 共享一份（旧语义）
      - SM_DATA_ISOLATION=${SM_DATA_ISOLATION:-false}
      # ── 工作区配额（0 = 不限；隔离关闭时不生效）────────────────
      - SM_WORKSPACE_MAX_MEMBERS=${SM_WORKSPACE_MAX_MEMBERS:-0}
      - SM_WORKSPACE_MAX_WATCHLIST_ITEMS=${SM_WORKSPACE_MAX_WATCHLIST_ITEMS:-0}
      - SM_WORKSPACE_MAX_ALERT_RULES=${SM_WORKSPACE_MAX_ALERT_RULES:-0}
      - SM_WORKSPACE_MAX_BACKTEST_RUNS=${SM_WORKSPACE_MAX_BACKTEST_RUNS:-0}
      - SM_WORKSPACE_MAX_STRATEGY_CONFIGS=${SM_WORKSPACE_MAX_STRATEGY_CONFIGS:-0}
      - SM_WORKSPACE_MAX_CHANNELS=${SM_WORKSPACE_MAX_CHANNELS:-0}
      # ── 数据库迁移与备份 ──────────────────────────────────────
      # 启动自动迁移；设 false 则要求先执行 `python -m stockmaster.cli db upgrade`
      - SM_DB_AUTO_MIGRATE=${SM_DB_AUTO_MIGRATE:-true}
      # 本地备份保留份数（/data/backups），0 表示不清理
      - SM_BACKUP_KEEP=${SM_BACKUP_KEEP:-7}
      # 备份是否包含 .auth_secret：含则归档等同凭据
      - SM_BACKUP_INCLUDE_SECRET=${SM_BACKUP_INCLUDE_SECRET:-true}
      # 反向代理（deploy/setup-tls.sh 接入的 stock.gookeryoung.cn）不在 127.0.0.1，
      # uvicorn 默认只信 127.0.0.1 的 X-Forwarded-*，不放开会把 nginx 容器的 IP
      # 记成客户端 IP，也认不出 X-Forwarded-Proto=https。
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-*}

    # 对外端口。生产与 cndb 的 nginx 同机反代（HTTPS 入口），SM_BIND 设 127.0.0.1
    # 只绑宿主回环，公网不再直达 8770；独立部署时可改回 0.0.0.0 直连。
    ports:
      - "${SM_BIND:-127.0.0.1:8770}:8770"

    # 与 cndb 的 nginx 共用一张网，nginx 用容器名回源，不依赖 172.18.0.1 网关。
    # 没有 cndb 的部署环境删除本段与下方 networks 定义即可。
    networks:
      - default
      - cndb_net

    # 日志轮转：不配的话 json-file 会无限增长把磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    # 首次启动要建库 + 起调度器，start_period 给足余量
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8770/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    security_opt:
      - no-new-privileges:true

volumes:
  stockmaster-data:
    name: ${SM_VOLUME:-stockmaster-data}

networks:
  cndb_net:
    external: true
    name: cndb_default
