# Alembic 配置 —— StockMaster
#
# 数据库 URL 不写在这里：backend/migrations/env.py 从 app.config.settings 读取
# （程序化调用时可用 set_main_option("sqlalchemy.url", ...) 覆盖），避免同一份
# 配置在开发机与容器里要维护两套路径。
#
# script_location 用 %(here)s 而不是相对路径：本文件既会被 `alembic` 命令按 cwd
# 找到，也会被 app.db.migrations 以绝对路径加载，相对路径在后者会解析到错误目录。
[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = %(here)s/backend
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
